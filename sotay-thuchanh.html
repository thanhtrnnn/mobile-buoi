<title>Ga Thực Hành Test 1</title>
<meta name="description" content="Sổ tay luyện nhớ chủ động cho bài thi thực hành Android Java Test 1: thẻ nhớ, điền chỗ trống, xếp dòng code, tìm lỗi, viết lại từ trí nhớ, tính tiền và thi thử 50 phút.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Doto:wght@700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #0E1012;
    --board: #121417;
    --board-row: #1A1D21;
    --board-line: #262A30;
    --led: #FFB21A;
    --led-dim: #B08A45;
    --led-glow: rgba(255, 178, 26, 0.32);
    /* giấy in nhiệt xám lạnh, mực đen + đỏ như vé in hai màu */
    --paper: #E2E5E7;
    --paper-2: #D5D9DC;
    --paper-3: #BCC2C7;
    --ink: #1B1D1F;
    --ink-2: #454A4F;
    --ink-3: #7C8287;
    --bad: #A3322A;
    --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-dot: "Doto", "JetBrains Mono", ui-monospace, monospace;
    --tear-ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--led); color: var(--board); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  kbd {
    font-family: var(--font-code);
    font-size: 11px;
    font-weight: 500;
    padding: 1px 6px;
    border: 1px solid currentColor;
    border-radius: 4px;
    opacity: 0.8;
    white-space: nowrap;
  }

  /* ---------- Nhà ga: bảng giờ tàu + sân ga ---------- */
  .station {
    display: grid;
    grid-template-columns: minmax(300px, 356px) minmax(0, 1fr);
    min-height: 100vh;
  }

  .board {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--board);
    border-right: 1px solid var(--board-line);
    color: var(--led);
    display: flex;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: var(--board-line) transparent;
  }
  .board-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--board-line);
  }
  .board-name { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .board-sub {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--led-dim);
  }
  .led-num {
    font-family: var(--font-dot);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px var(--led-glow);
  }
  .clock { font-size: 40px; line-height: 0.9; letter-spacing: 0.02em; }
  .clock[data-mode="exam"] { color: var(--led); }
  .clock-label {
    display: block;
    text-align: right;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--led-dim);
    margin-bottom: 6px;
  }

  .board-group {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 0 12px;
    padding: 12px 20px 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--led-dim);
  }
  .board-group span:last-child { text-align: right; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: baseline;
    gap: 0 12px;
    padding: 8px 20px;
    border-top: 1px solid var(--board-line);
    text-decoration: none;
    color: var(--led);
    transition: background-color 120ms ease-out;
  }
  .rows li:last-child .row { border-bottom: 1px solid var(--board-line); }
  .row:hover { background: var(--board-row); }
  .row:focus-visible { outline: 2px solid var(--led); outline-offset: -2px; }
  .row-key { font-family: var(--font-dot); font-weight: 900; font-size: 20px; line-height: 1; text-shadow: 0 0 12px var(--led-glow); }
  .row-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .row-sub { display: block; font-size: 12px; font-weight: 400; color: var(--led-dim); margin-top: 1px; }
  .row-state {
    display: grid;
    justify-items: end;
    color: var(--led-dim);
    white-space: nowrap;
    text-align: right;
  }
  .row-state .num { font-family: var(--font-dot); font-weight: 900; font-size: 17px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .row-state .unit { font-size: 11px; font-weight: 500; margin-top: 2px; }
  .row-state[data-hot] { color: var(--led); }
  .row-state[data-hot] .num { text-shadow: 0 0 12px var(--led-glow); }
  .row[aria-current="page"] { background: var(--led); color: var(--board); }
  .row[aria-current="page"] .row-key { text-shadow: none; }
  .row[aria-current="page"] .row-sub,
  .row[aria-current="page"] .row-state { color: var(--board); }
  .rows.ref .row { padding-top: 6px; padding-bottom: 6px; }
  .rows.ref .row-name { font-weight: 500; font-size: 14px; }

  /* danh sách cuộn bên trong, đầu bảng và chân bảng luôn hiện đủ */
  .board nav { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--board-line) transparent; }
  .board nav.more {
    -webkit-mask-image: linear-gradient(#000 calc(100% - 36px), transparent);
    mask-image: linear-gradient(#000 calc(100% - 36px), transparent);
  }
  .board-foot {
    flex: none;
    border-top: 1px solid var(--board-line);
    padding: 12px 20px 14px;
    font-size: 12px;
    color: var(--led-dim);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 12px;
  }
  .board-foot p { margin: 0; }
  .linkish {
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: inherit;
  }
  .linkish:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .platform {
    padding: 36px clamp(14px, 4vw, 56px) 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    min-width: 0;
  }

  .route {
    width: 100%;
    max-width: 880px;
    font-size: 13px;
    color: var(--led-dim);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }
  .route strong { color: var(--led); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; }
  .route ol { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; counter-reset: step; }
  .route li { counter-increment: step; }
  .route li::before { content: counter(step) " "; font-family: var(--font-dot); font-weight: 900; color: var(--led); }
  .route a { text-decoration: none; border-bottom: 1px solid var(--board-line); }
  .route a:hover { color: var(--led); border-color: var(--led-dim); }

  /* ---------- Tấm vé ---------- */
  .ticket {
    width: 100%;
    max-width: 880px;
    color: var(--ink);
    color-scheme: light;
    filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.55));
  }
  .t-main {
    position: relative;
    background: var(--paper);
    border-radius: 6px 6px 0 0;
  }
  .t-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 24px;
    padding: 22px 28px 16px;
    border-bottom: 1px solid var(--paper-3);
  }
  .t-title { grid-column: 1; margin: 2px 0 0; font-size: 24px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
  .t-no { grid-row: 1; grid-column: 2; align-self: start; text-align: right; }
  .t-no b { display: block; font-family: var(--font-dot); font-weight: 900; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .t-no span { font-size: 11px; color: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; }
  .t-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 10px 0 0; }
  .t-meta div { display: grid; }
  .t-meta dt { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .t-meta dd { margin: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .t-body { padding: 20px 28px 26px; display: grid; gap: 16px; }
  .t-body > p, .t-stub p { margin: 0; max-width: 68ch; }
  .prompt { font-size: 16.5px; font-weight: 500; line-height: 1.5; max-width: 62ch; text-wrap: pretty; }
  .hint { font-size: 13px; color: var(--ink-2); }

  /* đường xé: lỗ đục + khuyết hai bên */
  .perf {
    position: relative;
    height: 24px;
    background:
      radial-gradient(circle, var(--ground) 2.3px, transparent 2.8px) 6px 50% / 12px 24px repeat-x,
      var(--paper);
  }
  .perf::before, .perf::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ground);
  }
  .perf::before { left: -12px; }
  .perf::after { right: -12px; }
  .tear {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .tear:hover { background: var(--ink); color: var(--paper); }
  .tear:focus-visible { outline: 2px solid var(--led); outline-offset: 3px; }

  .t-stub {
    position: relative;
    background: var(--paper-2);
    border-radius: 0 0 6px 6px;
    padding: 18px 28px 24px;
    display: grid;
    gap: 14px;
    transform-origin: 18% 0;
    transition: transform 460ms var(--tear-ease);
  }
  .sealed {
    min-height: 92px;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-2);
    border: 1px dashed var(--ink-3);
    border-radius: 4px;
    background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(27, 29, 31, 0.07) 9px 10px);
  }
  .answer { display: none; gap: 14px; }
  .stub-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  .block-h { margin: 4px 0 0; font-size: 14px; font-weight: 700; }

  /* xé: giấy rách đúng hàng lỗ đục, mỗi mép giữ nửa lỗ (cùng bước 12px với .perf) */
  .t-stub::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -12px;
    height: 12px;
    opacity: 0;
    pointer-events: none;
    background: radial-gradient(circle at 6px 0, transparent 2.8px, var(--paper-2) 3.3px) 6px 0 / 12px 12px repeat-x;
    /* nửa dưới của hai chỗ khuyết hai bên */
    -webkit-mask:
      radial-gradient(circle at 0 0, transparent 11.5px, #000 12px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 0, transparent 11.5px, #000 12px) right / 51% 100% no-repeat;
    mask:
      radial-gradient(circle at 0 0, transparent 11.5px, #000 12px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 0, transparent 11.5px, #000 12px) right / 51% 100% no-repeat;
  }
  .ticket.torn .perf {
    background: radial-gradient(circle at 6px 100%, transparent 2.8px, var(--paper) 3.3px) 6px 0 / 12px 12px repeat-x;
  }
  .ticket.torn .tear { display: none; }
  .ticket.torn .t-stub::before { opacity: 1; }
  .ticket.torn .t-stub { transform: translateY(12px) rotate(-0.5deg); }
  .ticket.torn .sealed { display: none; }
  .ticket.torn .answer { display: grid; }

  .t-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px 16px;
    padding-top: 22px;
    color: var(--led-dim);
    font-size: 13px;
  }
  .ticket.torn .t-foot { padding-top: 32px; }
  .t-foot .btn { border-color: var(--board-line); color: var(--led); }
  .t-foot .btn:hover { background: var(--board-row); }

  /* ---------- Điều khiển trên giấy ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    text-decoration: none;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .btn:hover { background: rgba(27, 29, 31, 0.08); }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.solid:hover { background: #33373b; }
  .btn:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg button:focus-visible { outline: 2px solid var(--led); outline-offset: -2px; }

  code, pre { font-family: var(--font-code); }
  :not(pre) > code {
    font-size: 0.9em;
    padding: 0 4px;
    border-radius: 3px;
    background: rgba(27, 29, 31, 0.08);
    overflow-wrap: anywhere;
  }
  pre.code {
    margin: 0;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.6;
    border: 1px solid var(--paper-3);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.35);
    overflow-x: auto;
    white-space: pre;
    tab-size: 4;
    scrollbar-width: thin;
    scrollbar-color: var(--paper-3) transparent;
  }
  .t-stub pre.code { background: rgba(255, 255, 255, 0.3); }
  pre.code .c { color: var(--ink-2); font-style: italic; }
  pre.code .k { font-weight: 700; }

  .blank {
    display: inline-block;
    font: inherit;
    font-size: 13px;
    padding: 0 3px;
    margin: 0 1px;
    border: 0;
    border-bottom: 1.5px solid var(--ink);
    border-radius: 0;
    background: rgba(255, 178, 26, 0.16);
    color: var(--ink);
    caret-color: var(--ink);
    outline: none;
  }
  .blank:focus { background: rgba(255, 178, 26, 0.38); }
  .blank.line { width: calc(100% - 4ch); min-width: 20ch; }
  .blank[data-state="ok"] { border-bottom: 3px double var(--ink); color: var(--ink); background: transparent; font-weight: 700; }
  .blank[data-state="bad"] { border-bottom: 1.5px dashed var(--bad); color: var(--bad); background: rgba(163, 50, 42, 0.08); }

  .result-line { font-size: 14px; font-weight: 600; }
  .result-line[data-state="ok"] { color: var(--ink); }
  .result-line[data-state="bad"] { color: var(--bad); }
  .fixlist { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
  .fixlist li::marker { font-family: var(--font-code); font-size: 12px; color: var(--ink-2); }

  /* Parsons */
  .parsons { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .lane { display: grid; align-content: start; gap: 6px; min-height: 120px; padding: 10px; border: 1px dashed var(--ink-3); border-radius: 4px; }
  .lane-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .strip {
    display: flex;
    gap: 10px;
    align-items: baseline;
    text-align: left;
    width: 100%;
    padding: 5px 10px;
    font-family: var(--font-code);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre;
    overflow-x: auto;
    background: var(--paper);
    border: 1px solid var(--paper-3);
    border-radius: 3px;
    color: var(--ink);
  }
  .strip:hover { border-color: var(--ink-2); }
  .strip:focus-visible { outline: 2px solid var(--led); outline-offset: 1px; }
  .strip .n { font-family: var(--font-dot); font-weight: 900; color: var(--ink-2); min-width: 2ch; }
  .strip[data-state="ok"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
  .strip[data-state="bad"] { border-color: var(--bad); border-style: dashed; color: var(--bad); }

  /* Tìm lỗi */
  .lines { margin: 0; padding: 8px 0; list-style: none; border: 1px solid var(--paper-3); border-radius: 4px; background: rgba(255, 255, 255, 0.35); overflow-x: auto; }
  .lines button {
    display: grid;
    grid-template-columns: 4ch 1fr;
    gap: 12px;
    width: 100%;
    min-width: max-content;
    padding: 1px 16px 1px 8px;
    border: 0;
    background: transparent;
    text-align: left;
    font-family: var(--font-code);
    font-size: 13px;
    line-height: 1.7;
    white-space: pre;
    color: var(--ink);
  }
  .lines button .ln { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .lines button:hover { background: rgba(27, 29, 31, 0.06); }
  .lines button:focus-visible { outline: 2px solid var(--led); outline-offset: -2px; }
  .lines button[aria-pressed="true"] { background: rgba(255, 178, 26, 0.32); }
  .lines button[data-state="ok"] { background: rgba(27, 29, 31, 0.1); font-weight: 700; }
  .lines button[data-state="bad"] { grid-template-columns: 4ch auto 1fr; background: rgba(163, 50, 42, 0.08); color: var(--bad); outline: 1.5px dashed var(--bad); outline-offset: -2px; }
  .lines button[data-state="bad"]::after { content: "bạn chọn"; margin-left: 16px; font-family: var(--font-body); font-size: 11px; font-weight: 700; }

  /* Viết lại từ trí nhớ */
  .writer {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    padding: 14px 16px;
    font-family: var(--font-code);
    font-size: 13px;
    line-height: 1.6;
    tab-size: 4;
    color: var(--ink);
    caret-color: var(--ink);
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid var(--ink-3);
    border-radius: 4px;
  }
  .writer:focus { outline: 2px solid var(--led); outline-offset: 1px; }
  .diff { margin: 0; padding: 10px 0; list-style: none; font-family: var(--font-code); font-size: 12.5px; line-height: 1.6; border: 1px solid var(--paper-3); border-radius: 4px; background: rgba(255, 255, 255, 0.3); overflow-x: auto; }
  .diff li { display: grid; grid-template-columns: 5ch 1fr; gap: 8px; padding: 0 14px 0 8px; white-space: pre; min-width: max-content; }
  .diff .tag { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .diff li[data-state="ok"] .tag { color: var(--ink); }
  .diff li[data-state="miss"] { background: rgba(163, 50, 42, 0.08); color: var(--bad); }
  .diff li[data-state="extra"] { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }

  /* Tính tiền */
  .fare { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--paper-3); border-radius: 4px; }
  .fare div { padding: 10px 14px; display: grid; gap: 2px; }
  .fare div + div { border-left: 1px dashed var(--paper-3); }
  .fare dt { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .fare dd { margin: 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stars { font-family: var(--font-dot); font-weight: 900; letter-spacing: 0.1em; }
  .field { display: grid; gap: 6px; max-width: 320px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input {
    font-family: var(--font-dot);
    font-weight: 900;
    font-size: 30px;
    padding: 6px 12px;
    color: var(--ink);
    caret-color: var(--ink);
    background: rgba(255, 255, 255, 0.45);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .field input:focus { outline: 2px solid var(--led); outline-offset: 1px; }
  .work { margin: 0; padding: 0; list-style: none; font-family: var(--font-code); font-size: 13.5px; line-height: 1.8; font-variant-numeric: tabular-nums; }

  /* Thi thử */
  .exam-grid { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .exam-grid figure { margin: 0; border: 1px solid var(--paper-3); border-radius: 4px; background: #fff; overflow: hidden; }
  .exam-grid img { display: block; width: 100%; height: auto; }
  .exam-grid figcaption { padding: 6px 8px; font-size: 11.5px; color: var(--ink-2); background: var(--paper); border-top: 1px solid var(--paper-3); }
  .exam-q h3 { margin: 0 0 4px; font-size: 15px; }
  .exam-q ul { margin: 6px 0 0; padding-left: 20px; }
  .exam-q + .exam-q { margin-top: 14px; }
  .timer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .timer { font-family: var(--font-dot); font-weight: 900; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .rubric { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .rubric label { display: grid; grid-template-columns: 20px 1fr 4ch; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 14px; cursor: pointer; }
  .rubric input { accent-color: var(--ink); width: 16px; height: 16px; }
  .rubric .pt { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .rubric-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
  .history { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .history th { text-align: left; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--paper-3); }
  .history td { padding: 5px 8px 5px 0; border-bottom: 1px dashed var(--paper-3); }

  /* Tờ tra cứu */
  .sheet { display: grid; gap: 0; }
  .sheet details { border-top: 1px dashed var(--paper-3); }
  .sheet details:last-child { border-bottom: 1px dashed var(--paper-3); }
  .sheet summary {
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 12px 2px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
  }
  .sheet summary::-webkit-details-marker { display: none; }
  .sheet summary::after { content: "Mở"; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .sheet details[open] summary::after { content: "Gập"; }
  .sheet summary:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  .sheet .inner { padding: 2px 2px 18px; display: grid; gap: 12px; font-size: 14.5px; }
  .sheet .inner p, .sheet .inner li { max-width: 70ch; }
  .sheet .inner ul, .sheet .inner ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  .src { font-size: 12px; color: var(--ink-2); }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: left; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--paper-3); }
  .tbl td { padding: 7px 10px 7px 0; border-bottom: 1px dashed var(--paper-3); vertical-align: top; }
  .tbl td:first-child { white-space: nowrap; }

  .flash-q { font-size: 20px; font-weight: 600; line-height: 1.45; max-width: 40ch; text-wrap: pretty; }
  .flash-a { font-size: 15.5px; display: grid; gap: 10px; }
  .grade { display: flex; flex-wrap: wrap; gap: 8px; }
  .boxes { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .boxes b { color: var(--ink); }
  .empty-note { font-size: 15px; }

  @media (max-width: 880px) {
    .station { grid-template-columns: minmax(0, 1fr); }
    .board nav { flex: none; overflow: visible; }
    .board { position: sticky; top: 0; z-index: 5; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--board-line); }
    .board-head { padding: 12px 14px 10px; align-items: center; }
    .board-name { font-size: 15px; }
    .board-sub { display: none; }
    .clock { font-size: 28px; }
    .clock-label { display: none; }
    .board-group, .board-foot { display: none; }
    .rows {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      border-top: 1px solid var(--board-line);
      -webkit-mask-image: linear-gradient(to right, #000 80%, transparent);
      mask-image: linear-gradient(to right, #000 80%, transparent);
      padding-right: 48px;
    }
    .rows.ref { border-top: 0; }
    .rows li { flex: none; }
    .row, .rows li:last-child .row { grid-template-columns: auto auto auto; align-items: center; gap: 0 8px; padding: 8px 12px; border: 0; border-right: 1px solid var(--board-line); }
    .row-sub, .row-state .unit, .rows.ref .row-state, .rows.ref .row-key { display: none; }
    .row-state .num { font-size: 14px; }
    .row-name { font-size: 13.5px; white-space: nowrap; }
    .row-key { font-size: 16px; }
    .rows.ref .row { padding: 5px 12px 7px; border-right-color: transparent; }
    .rows.ref .row-name { font-size: 12.5px; font-weight: 500; color: var(--led-dim); }
    .rows.ref .row[aria-current="page"] .row-name { color: var(--board); }
    .platform { padding-top: 20px; }
    .route { order: 2; }
    .t-head, .t-body { padding-left: 18px; padding-right: 18px; }
    .t-stub { padding-left: 18px; padding-right: 18px; }
    .t-title { font-size: 20px; }
    .parsons, .exam-grid { grid-template-columns: minmax(0, 1fr); }
    .exam-grid figure { max-width: 200px; }
    .fare { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fare div:nth-child(3) { border-left: 0; }
    .fare div:nth-child(n + 3) { border-top: 1px dashed var(--paper-3); }
    .kbd-hint { display: none; }
  }

  /* trên giấy: vòng focus bằng mực, hổ phách trên giấy xám không đủ tương phản */
  .ticket .t-main :focus-visible,
  .ticket .perf :focus-visible,
  .ticket .t-stub :focus-visible,
  .ticket .t-main .writer:focus,
  .ticket .t-main .field input:focus { outline-color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .t-stub, .row, .btn, .tear { transition: none; }
    .ticket.torn .t-stub { transform: translateY(10px); }
  }
</style>

position);\n    }\n    return true;\n});\npopup.show();","forresult-return":"User newUser = new User(txtUN.getText().toString().trim(),\n                        txtPW.getText().toString().trim());\nIntent result = new Intent();\nresult.putExtra(\"user\", newUser);\nsetResult(RESULT_OK, result);\nfinish();","datepicker":"Calendar c = Calendar.getInstance();\nnew DatePickerDialog(this, (view, year, month, dayOfMonth) -> {\n    // month đếm từ 0, nên phải + 1\n    txtDob.setText(String.format(Locale.US, \"%02d/%02d/%d\", dayOfMonth, month + 1, year));\n}, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();","spinner":"Spinner spType = findViewById(R.id.spType);\nString[] types = {\"First Class\", \"Business Class\", \"Economy Class\"};\nArrayAdapter<String> typeAdapter = new ArrayAdapter<>(this,\n        android.R.layout.simple_spinner_item, types);\ntypeAdapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);\nspType.setAdapter(typeAdapter);\n\nspType.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {\n    @Override\n    public void onItemSelected(AdapterView<?> parent, View view, int position, long id) {\n        String chosen = types[position];\n    }\n\n    @Override\n    public void onNothingSelected(AdapterView<?> parent) { }\n});\nint pos = spType.getSelectedItemPosition();","radio":"RadioGroup rgType = findViewById(R.id.rgType);\nint checkedId = rgType.getCheckedRadioButtonId();  // -1 nếu chưa chọn\nrgType.setOnCheckedChangeListener((group, id) -> {\n    if (id == R.id.rbFirst) {\n        // chọn First Class\n    }\n});","rating":"RatingBar ratingBar = findViewById(R.id.ratingBar);\nTextView lblTotal = findViewById(R.id.lblTotal);\nratingBar.setOnRatingBarChangeListener((bar, rating, fromUser) -> {\n    double total = baseTotal;\n    if (rating == 5) {\n        total = total * 0.95;\n    }\n    lblTotal.setText(String.format(Locale.US, \"%,.0fK\", total));\n});","checkbox":"CheckBox cbIce = findViewById(R.id.cbIce);\nboolean ice = cbIce.isChecked();\ncbIce.setOnCheckedChangeListener((button, isChecked) -> {\n    // tick hoặc bỏ tick\n});","parse":"EditText txtQty = findViewById(R.id.txtQty);\nString qtyText = txtQty.getText().toString().trim();\nif (qtyText.isEmpty()) {\n    Toast.makeText(this, \"Nhập số vé\", Toast.LENGTH_SHORT).show();\n    return;\n}\nint qty;\ntry {\n    qty = Integer.parseInt(qtyText);\n} catch (NumberFormatException e) {\n    Toast.makeText(this, \"Số vé không hợp lệ\", Toast.LENGTH_SHORT).show();\n    return;\n}","visibility":"View layoutResult = findViewById(R.id.layoutResult);\nlayoutResult.setVisibility(View.VISIBLE);   // hiện\nlayoutResult.setVisibility(View.GONE);      // ẩn, không chiếm chỗ","xmlonclick":"// Trong XML: <Button ... android:onClick=\"onBookClick\" />\npublic void onBookClick(View v) {\n    Toast.makeText(this, \"Đã bấm Đặt vé\", Toast.LENGTH_SHORT).show();\n}"},"files":{"cau1.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- Câu 1: form đăng ký theo hình trong đề.\n     View gốc không đặt padding: code template (insets) sẽ ghi đè padding của nó.\n     Padding đặt ở LinearLayout bên trong. -->\n<ScrollView xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\n    android:background=\"#FFFFFF\">\n\n    <LinearLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:orientation=\"vertical\"\n        android:paddingLeft=\"20dp\"\n        android:paddingRight=\"20dp\"\n        android:paddingBottom=\"24dp\">\n\n        <ImageView\n            android:id=\"@+id/imgBanner\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\"\n            android:layout_marginTop=\"8dp\"\n            android:adjustViewBounds=\"true\"\n            android:scaleType=\"fitCenter\"\n            android:src=\"@drawable/illustration\" />\n\n        <EditText\n            android:id=\"@+id/txtFullname\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"52dp\"\n            android:layout_marginTop=\"72dp\"\n            android:background=\"@drawable/bg_edittext\"\n            android:hint=\"Nama Lengkap\"\n            android:inputType=\"textPersonName\"\n            android:paddingLeft=\"18dp\"\n            android:paddingRight=\"18dp\"\n            android:textColorHint=\"#9E9E9E\"\n            android:textSize=\"16sp\" />\n\n        <EditText\n            android:id=\"@+id/txtEmail\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"52dp\"\n            android:layout_marginTop=\"22dp\"\n            android:background=\"@drawable/bg_edittext\"\n            android:hint=\"Email\"\n            android:inputType=\"textEmailAddress\"\n            android:paddingLeft=\"18dp\"\n            android:paddingRight=\"18dp\"\n            android:textColorHint=\"#9E9E9E\"\n            android:textSize=\"16sp\" />\n\n        <EditText\n            android:id=\"@+id/txtPhone\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"52dp\"\n            android:layout_marginTop=\"22dp\"\n            android:background=\"@drawable/bg_edittext\"\n            android:hint=\"Nomor HP\"\n            android:inputType=\"phone\"\n            android:paddingLeft=\"18dp\"\n            android:paddingRight=\"18dp\"\n            android:textColorHint=\"#9E9E9E\"\n            android:textSize=\"16sp\" />\n\n        <EditText\n            android:id=\"@+id/txtPassword\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"52dp\"\n            android:layout_marginTop=\"22dp\"\n            android:background=\"@drawable/bg_edittext\"\n            android:hint=\"Password\"\n            android:inputType=\"textPassword\"\n            android:paddingLeft=\"18dp\"\n            android:paddingRight=\"18dp\"\n            android:textColorHint=\"#9E9E9E\"\n            android:textSize=\"16sp\" />\n\n        <EditText\n            android:id=\"@+id/txtConfirm\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"52dp\"\n            android:layout_marginTop=\"22dp\"\n            android:background=\"@drawable/bg_edittext\"\n            android:hint=\"Konfirmasi Password\"\n            android:inputType=\"textPassword\"\n            android:paddingLeft=\"18dp\"\n            android:paddingRight=\"18dp\"\n            android:textColorHint=\"#9E9E9E\"\n            android:textSize=\"16sp\" />\n\n        <!-- Theme Material tô màu primary lên mọi Button, nên phải tắt tint\n             thì nền xanh trong bg_button mới hiện ra -->\n        <Button\n            android:id=\"@+id/btnRegister\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"52dp\"\n            android:layout_marginTop=\"40dp\"\n            android:background=\"@drawable/bg_button\"\n            android:text=\"Mendaftar\"\n            android:textAllCaps=\"false\"\n            android:textColor=\"#FFFFFF\"\n            android:textSize=\"16sp\"\n            android:textStyle=\"bold\"\n            app:backgroundTint=\"@null\" />\n\n    <\/LinearLayout>\n\n<\/ScrollView>","cau2.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- Câu 2: đặt vé. Khối kết quả ẩn (gone) cho tới khi bấm Đặt vé. -->\n<ScrollView xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\">\n\n    <LinearLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:orientation=\"vertical\"\n        android:padding=\"20dp\">\n\n        <TextView\n            android:layout_width=      android:id=\"@+id/txtQty\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\"\n            android:hint=\"Số vé\"\n            android:inputType=\"number\" />\n\n        <EditText\n            android:id=\"@+id/txtDiscount\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\"\n            android:hint=\"Giảm giá (%)\"\n            android:inputType=\"numberDecimal\" />\n\n        <Button\n            android:id=\"@+id/btnBook\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\"\n            android:layout_marginTop=\"12dp\"\n            android:text=\"Đặt vé\" />\n\n        <LinearLayout\n            android:id=\"@+id/layoutResult\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"wrap_content\"\n            android:layout_marginTop=\"20dp\"\n            android:orientation=\"vertical\"\n            android:visibility=\"gone\">\n\n            <TextView\n                android:id=\"@+id/lblName\"\n                android:layout_width=\"wrap_content\"\n                android:layout_height=\"wrap_content\"\n                android:textSize=\"16sp\" />\n\n            <TextView\n                android:id=\"@+id/lblPhone\"\n                android:layout_width=\"wrap_content\"\n                android:layout_height=\"wrap_content\"\n                android:textSize=\"16sp\" />\n\n            <TextView\n                android:id=\"@+id/lblTotal\"\n                android:layout_width=\"wrap_content\"\n                android:layout_height=\"wrap_content\"\n                android:textSize=\"18sp\"\n                android:textStyle=\"bold\" />\n\n            <!-- wrap_content: để match_parent thì RatingBar bị kéo giãn, méo sao -->\n            <RatingBar\n                android:id=\"@+id/ratingBar\"\n                android:layout_width=\"wrap_content\"\n                android:layout_height=\"wrap_content\"\n                android:layout_marginTop=\"8dp\"\n                android:numStars=\"5\"\n                android:stepSize=\"1\" />\n\n        <\/LinearLayout>\n\n    <\/LinearLayout>\n\n<\/ScrollView>","bg_edittext.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- Ô nhập ở Câu 1: nền trắng, viền xám 2dp, bo góc -->\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:shape=\"rectangle\">\n    <solid android:color=\"#FFFFFF\" />\n    <stroke\n        android:width=\"2dp\"\n        android:color=\"#BDBDBD\" />\n    <corners android:radius=\"8dp\" />\n<\/shape>","bg_button.xml":"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- Nút Mendaftar ở Câu 1: nền xanh, bo góc -->\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:shape=\"rectangle\">\n    <solid android:color=\"#3498DB\" />\n    <corners android:radius=\"8dp\" />\n<\/shape>","Cau1Act.java":"package ptit.cnpm1.tranxuanthanh.thuchanh;\n\nimport android.os.Bundle;\n\nimport androidx.activity.EdgeToEdge;\nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.graphics.Insets;\nimport androidx.core.view.ViewCompat;\nimport androidx.core.view.WindowInsetsCompat;\n\n/** Câu 1 chỉ chấm giao diện, nên activity chỉ cần hiện layout. */\npublic class Cau1Act extends AppCompatActivity {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        EdgeToEdge.enable(this);\n        setContentView(R.layout.cau1);\n        ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main), (v, insets) -> {\n            Insets systemBars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n            v.setPadding(systemBars.left, systemBars.top, systemBars.right, systemBars.bottom);\n            return insets;\n        });\n    }\n}","Cau2Act.java":"package ptit.cnpm1.tranxuanthanh.thuchanh;\n\nimport android.os.Bundle;\nimport android.view.View;\nimport android.widget.Button;\nimport android.widget.EditText;\nimport android.widget.LinearLayout;\nimport android.widget.RadioGroup;\nimport android.widget.RatingBar;\nimport android.widget.TextView;\nimport android.widget.Toast;\n\nimport androidx.activity.EdgeToEdge;\nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.graphics.Insets;\nimport androidx.core.view.ViewCompat;\nimport androidx.core.view.WindowInsetsCompat;\n\nimport java.util.Locale;\n\npublic class Cau2Act extends AppCompatActivity implements View.OnClickListener {\n\n    // Giá vé, đơn vị nghìn đồng (K)\n    private static final int PRICE_FIRST = 1500;\n    private static final int PRICE_BUSINESS = 1300;\n    private static final int PRICE_ECONOMY = 1000;\n\n    private EditText txtName;\n    private EditText txtPhone;\n    private RadioGroup rgType;\n    private EditText txtQty;\n    private EditText txtDiscount;\n    private Button btnBook;\n\n    private LinearLayout layoutResult;\n    private TextView lblName;\n    private TextView lblPhone;\n    private TextView lblTotal;\n    private RatingBar ratingBar;\n\n    /** Tổng tiền sau giảm giá, chưa tính 5% thưởng khi chấm 5 sao. */\n    private double baseTotal = 0;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        EdgeToEdge.enable(this);\n        setContentView(R.layout.cau2);\n        ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main), (v, insets) -> {\n            Insets systemBars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n            v.setPadding(systemBars.left, systemBars.top, systemBars.right, systemBars.bottom);\n            return insets;\n        });\n\n        txtName = findViewById(R.id.txtName);\n        txtPhone = findViewById(R.id.txtPhone);\n        rgType = findViewById(R.id.rgType);\n        txtQty = findViewById(R.id.txtQty);\n        txtDiscount = findViewById(R.id.txtDiscount);\n        btnBook = findViewById(R.id.btnBook);\n\n        layoutResult = findViewById(R.id.layoutResult);\n        lblName = findViewById(R.id.lblName);\n        lblPhone = findViewById(R.id.lblPhone);\n        lblTotal = findViewById(R.id.lblTotal);\n        ratingBar = findViewById(R.id.ratingBar);\n\n        btnBook.setOnClickListener(this);\n\n        // Mỗi lần đổi số sao thì tính lại tiền từ baseTotal\n        ratingBar.setOnRatingBarChangeListener((bar, rating, fromUser) -> showTotal(rating));\n    }\n\n    @Override\n    public void onClick(View v) {\n        if (v.getId() == R.id.btnBook) {\n            book();\n        }\n    }\n\n    private void book() {\n        String name = txtName.getText().toString().trim();\n        String phone = txtPhone.getText().toString().trim();\n        String qtyText = txtQty.getText().toString().trim();\n        String discountText = txtDiscount.getText().toString().trim();\n\n        if (name.isEmpty() || phone.isEmpty() || qtyText.isEmpty()) {\n            Toast.makeText(this, \"Vui lòng nhập đầy đủ thông tin\", Toast.LENGTH_SHORT).show();\n            return;\n        }\n\n        int checkedId = rgType.getCheckedRadioButtonId();\n        if (checkedId == -1) {\n            Toast.makeText(this, \"Vui lòng chọn loại vé\", Toast.LENGTH_SHORT).show();\n            return;\n        }\n\n        int qty;\n        double discount;\n        try {\n            qty = Integer.parseInt(qtyText);\n            // Bỏ trống ô giảm giá thì coi như 0%\n            discount = discountText.isEmpty() ? 0 : Double.parseDouble(discountText);\n        } catch (NumberFormatException e) {\n            Toast.makeText(this, \"Số vé hoặc giảm giá không hợp lệ\", Toast.LENGTH_SHORT).show();\n            return;\n        }\n\n        if (qty <= 0) {\n            Toast.makeText(this, \"Số vé phải lớn hơn 0\", Toast.LENGTH_SHORT).show();\n            return;\n        }\n        if (discount < 0 || discount > 100) {\n            Toast.makeText(this, \"Giảm giá phải từ 0 đến 100%\", Toast.LENGTH_SHORT).show();\n            return;\n        }\n\n        // R.id không còn là hằng số (AGP 8), nên dùng if/else chứ không dùng switch\n        int price;\n        if (checkedId == R.id.rbFirst) {\n            price = PRICE_FIRST;\n        } else if (checkedId == R.id.rbBusiness) {\n            price = PRICE_BUSINESS;\n        } else {\n            price = PRICE_ECONOMY;\n        }\n\n        // Tổng tiền = giá vé x số vé - giảm giá, giảm giá tính theo % của tiền vé\n        baseTotal = price * qty * (1 - discount / 100);\n\n        lblName.setText(\"Họ tên: \" + name);\n        lblPhone.setText(\"Số điện thoại: \" + phone);\n        ratingBar.setRating(0);\n        showTotal(0);\n        layoutResult.setVisibility(View.VISIBLE);\n    }\n\n    private void showTotal(float rating) {\n        double total = baseTotal;\n        if (rating == 5) {\n            total = total * 0.95; // 5 sao: giảm thêm 5%\n        }\n        lblTotal.setText(\"Tổng tiền: \" + String.format(Locale.US, \"%,.0fK\", total));\n    }\n}"},"parts":{"cau1-email":"<EditText\n    android:id=\"@+id/txtEmail\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"52dp\"\n    android:layout_marginTop=\"22dp\"\n    android:background=\"@drawable/bg_edittext\"\n    android:hint=\"Email\"\n    android:inputType=\"textEmailAddress\"\n    android:paddingLeft=\"18dp\"\n    android:paddingRight=\"18dp\"\n    android:textColorHint=\"#9E9E9E\"\n    android:textSize=\"16sp\" />","cau1-button":"<Button\n    android:id=\"@+id/btnRegister\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"52dp\"\n    android:layout_marginTop=\"40dp\"\n    android:background=\"@drawable/bg_button\"\n    android:text=\"Mendaftar\"\n    android:textAllCaps=\"false\"\n    android:textColor=\"#FFFFFF\"\n    android:textSize=\"16sp\"\n    android:textStyle=\"bold\"\n    app:backgroundTint=\"@null\" />","cau2-result":"<LinearLayout\n    android:id=\"@+id/layoutR   { id: "f01", tag: "XML", q: "Ảnh trong ImageView rộng `match_parent`, cao `wrap_content`. Thuộc tính nào giữ đúng tỉ lệ ảnh?", a: "`android:adjustViewBounds=\"true\"`, thường kèm `android:scaleType=\"fitCenter\"`." },
  { id: "f02", tag: "Drawable", q: "Viết file drawable nền ô nhập: nền trắng, viền xám 2dp, bo góc 8dp.", a: "```<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:shape=\"rectangle\">\n    <solid android:color=\"#FFFFFF\" />\n    <stroke android:width=\"2dp\" android:color=\"#BDBDBD\" />\n    <corners android:radius=\"8dp\" />\n</shape>```" },
  { id: "f03", tag: "Drawable", q: "Trong `<shape>`: thẻ nào tô nền, thẻ nào vẽ viền, thẻ nào bo góc, thẻ nào đệm trong?", a: "`<solid>` tô nền, `<stroke>` vẽ viền, `<corners>` bo góc, `<padding>` đệm trong." },
  { id: "f04", tag: "XML", q: "Button đã có `android:background=\"@drawable/bg_button\"` mà vẫn hiện màu tím/xanh của theme. Sửa thế nào?", a: "Theme Material tô tint lên mọi Button. Thêm `app:backgroundTint=\"@null\"` (cần `xmlns:app` ở view gốc), hoặc đổi thẻ thành `androidx.appcompat.widget.AppCompatButton`." },
  { id: "f05", tag: "XML", q: "inputType cho: họ tên, email, số điện thoại, mật khẩu, số nguyên, số thập phân?", a: "`textPersonName`, `textEmailAddress`, `phone`, `textPassword`, `number`, `numberDecimal`." },
  { id: "f06", tag: "XML", q: "Chữ mờ gợi ý trong ô nhập dùng thuộc tính gì? Đổi màu nó bằng gì?", a: "`android:hint=\"...\"` và `android:textColorHint=\"#9E9E9E\"`." },
  { id: "f07", tag: "XML", q: "Gõ `android:text=\"Mendaftar\"` mà nút hiện MENDAFTAR. Tắt in hoa thế nào?", a: "`android:textAllCaps=\"false\"`." },
  { id: "f08", tag: "XML", q: "`margin` khác `padding` thế nào?", a: "`margin`: khoảng trống bên ngoài view, đẩy view khác ra. `padding`: đệm bên trong, giữa viền và nội dung." },

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const pre = (code) => `<pre class="code">${hl(code)}</pre>`;
// Tô nhẹ: comment nghiêng xám, từ khóa Java đậm. Giấy in nhiệt chỉ có một màu mực.
function hl(code) {
  return esc(code)
    .split("\n")
    .map((line) => {
      const m = line.match(/^(\s*)(\/\/.*|&lt;!--.*--&gt;)$/);
      if (m) return `${m[1]}<span class="c">${m[2]}</span>`;
      return line.replace(/\b(public|private|protected|class|void|new|return|if|else|try|catch|final|static|int|double|float|boolean|extends|implements|import|package)\b/g, '<span class="k">$1</span>');
    })
    .join("\n");
}

    { t: "Tạo file và màn hình", h: `<ul><li>Layout: chuột phải <code>res/layout</code> → New → Layout Resource File.</li><li>Drawable: chuột phải <code>res/drawable</code> → New → Drawable Resource File, Root element <code>shape</code>.</li><li>Activity mới: chuột phải package → New → Activity → Empty Views Activity. Cách này tự khai manifest và tự tạo layout.</li><li>Ảnh: kéo file .png vào <code>res/drawable</code>, đổi tên chữ thường.</li></ul>` },

<script>
// ---------- Lưu tiến độ ----------
const STORE_KEY = "ga-thuc-hanh-v1";
function freshState() { return { flash: {}, done: {}, drafts: {}, mock: [], calcCount: 0, clozeLevel: 1 }; }
let S = (() => {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    return raw && typeof raw === "object" ? Object.assign(freshState(), raw) : freshState();
  } catch (e) {
    return freshState();
  }
})();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* trình duyệt chặn lưu: trang vẫn chạy */ }
}

// ---------- Tiện ích ----------
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const pad2 = (n) => String(n).padStart(2, "0");
const strip = (s) => String(s).replace(/\s+/g, "");
const money = (n) => Math.round(n).toLocaleString("en-US") + "K";
function inline(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function fmt(t) {
  return t.split("```").map((part, i) => {
    if (i % 2) return pre(part.replace(/^\n+|\n+$/g, ""));
    return part.trim() ? `<p>${inline(part.trim())}</p>` : "";
  }).join("");
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function relatedRef(topic) {
  if (/^Câu 1/.test(topic)) return ["cau1", "Tra cứu Câu 1"];
  if (/^Câu 2/.test(topic)) return ["cau2", "Tra cứu Câu 2"];
  return ["mau", "Tra cứu mẫu b01–b04"];
}
function doneCount(prefix, list, test = (v) => v === "ok") {
  return list.filter((it) => test(S.done[prefix + ":" + it.id])).length;
}

// ---------- Vỏ tấm vé ----------
let view = null;          // bài đang mở
const ticketEl = $("#ticket");

function ticketHTML(v) {
  // loại bài và giờ in nằm trong hàng ô thông tin như trên vé tàu
  const d = new Date();
  const fields = [["Loại", esc(v.kind)], ...(v.meta || [])];
  if (!v.sheet) fields.push(["Giờ in", pad2(d.getHours()) + ":" + pad2(d.getMinutes())]);
  const meta = fields.map(([k, val]) => `<div><dt>${esc(k)}</dt><dd>${val}</dd></div>`).join("");
  const head = `
    <header class="t-head">
      <h1 class="t-title">${esc(v.title)}</h1>
      ${v.no ? `<div class="t-no"><b>${esc(v.no)}</b><span>${esc(v.noLabel || "")}</span></div>` : ""}
      ${meta ? `<dl class="t-meta">${meta}</dl>` : ""}
    </header>`;
  if (v.sheet) {
    return `<div class="t-main" style="border-radius:6px">${head}<section class="t-body">${v.body}</section></div>
      ${v.foot ? `<nav class="t-foot" aria-label="Chuyển trang">${v.foot}</nav>` : ""}`;
  }
  return `
    <div class="t-main">${head}<section class="t-body">${v.body}</section></div>
    <div class="perf"><button type="button" class="tear" data-act="tear">${esc(v.tearLabel || "Xé cuống, xem đáp án")} <kbd class="kbd-hint">Space</kbd></button></div>
    <section class="t-stub" aria-label="Cuống vé">
      <div class="sealed">${esc(v.sealed || "Đáp án giữ dưới cuống. Tự nhớ trước rồi mới xé.")}</div>
      <div class="answer" id="answer"></div>
    </section>
    ${v.foot ? `<nav class="t-foot" aria-label="Chuyển bài">${v.foot}</nav>` : ""}`;
}

function mount(v) {
  view = v;
  ticketEl.classList.remove("torn");
  ticketEl.innerHTML = ticketHTML(v);
  if (v.mount) v.mount(ticketEl);
  if (v.startTorn) tear();
}

function tear() {
  if (!view || view.sheet || ticketEl.classList.contains("torn")) return;
  const html = view.onTear ? view.onTear(ticketEl) : "";
  $("#answer").innerHTML = html;
  ticketEl.classList.add("torn");
  if (view.afterTear) view.afterTear(ticketEl);
  paintBoard();
}

function reseal() {
  ticketEl.classList.remove("torn");
  $("#answer").innerHTML = "";
  if (view && view.onReseal) view.onReseal(ticketEl);
}

// dòng kết quả tự đứng đầu cuống, nút dán lại nằm bên phải
const resealBar = (verdictHTML) =>
  `<div class="stub-bar">${verdictHTML}<button type="button" class="linkish" data-act="reseal">Dán lại cuống, làm lại</button></div>`;
const verdict = (ok, text) => `<p class="result-line" data-state="${ok ? "ok" : "bad"}">${text}</p>`;

function stepFoot(id, idx, total, extra = "") {
  const prev = idx > 1 ? `<a class="btn" href="#${id}/${idx - 1}">Vé trước <kbd class="kbd-hint">←</kbd></a>` : `<span></span>`;
  const next = idx < total ? `<a class="btn" href="#${id}/${idx + 1}">Vé sau <kbd class="kbd-hint">→</kbd></a>` : `<span></span>`;
  return `${prev}${extra}${next}`;
}

// ---------- 1. Thẻ nhớ (hộp Leitner) ----------
const BOX_WAIT = [0, 60e3, 10 * 60e3, 60 * 60e3, 8 * 3600e3, 24 * 3600e3]; // hộp 1: 1 phút … hộp 5: 1 ngày
function cardState(id) { return S.flash[id] || { box: 0, due: 0 }; }
function dueCards(now = Date.now()) { return FLASH.filter((c) => cardState(c.id).due <= now); }
let flashExtra = false; // ôn thêm khi hết thẻ đến hạn

function flashView() {
  const now = Date.now();
  let queue = dueCards(now).sort((a, b) => cardState(a.id).due - cardState(b.id).due);
  if (!queue.length && flashExtra) queue = FLASH.filter((c) => cardState(c.id).box <= 3).sort((a, b) => cardState(a.id).box - cardState(b.id).box);
  const boxes = [0, 1, 2, 3, 4, 5].map((b) => FLASH.filter((c) => cardState(c.id).box === b).length);
  const boxLine = `<p class="boxes">${boxes.map((n, b) => `<span>Hộp ${b}: <b>${n}</b></span>`).join("")}</p>`;

  if (!queue.length) {
    const next = Math.min(...FLASH.map((c) => cardState(c.id).due));
    const mins = Math.max(1, Math.round((next - now) / 60e3));
    return {
      kind: "Thẻ nhớ", title: "Hết thẻ đến hạn", sheet: true,
      body: `<p class="empty-note">Thẻ tiếp theo đến hạn sau khoảng ${mins} phút. Trong lúc chờ, ôn thêm các thẻ chưa chắc (hộp 0–3) hoặc sang bài khác.</p>
        <div class="btn-row"><button type="button" class="btn solid" data-act="flash-extra">Ôn thêm thẻ chưa chắc</button><a class="btn" href="#cloze">Sang điền chỗ trống</a></div>${boxLine}`
    };
  }
  const card = queue[0];
  const st = cardState(card.id);
  const pos = FLASH.indexOf(card) + 1;
  return {
    kind: "Thẻ nhớ", title: card.tag === "Lỗi" ? "Vì sao lỗi?" : "Nhớ lại",
    no: "Nº " + pad2(pos), noLabel: "trên " + FLASH.length + " thẻ",
    meta: [["Chủ đề", esc(card.tag)], ["Hộp", String(st.box)], ["Đến hạn", String(dueCards(now).length)]],
    body: `<p class="flash-q">${inline(card.q)}</p><p class="hint">Nói to hoặc viết ra giấy câu trả lời, rồi mới xé cuống.</p>`,
    onTear: () => `<div class="flash-a">${fmt(card.a)}</div>
      <div class="grade" role="group" aria-label="Tự chấm">
        <button type="button" class="btn" data-grade="0">Quên <kbd>A</kbd></button>
        <button type="button" class="btn" data-grade="1">Mơ hồ <kbd>S</kbd></button>
        <button type="button" class="btn solid" data-grade="2">Nhớ chắc <kbd>D</kbd></button>
      </div>${boxLine}`,
    grade(g) {
      const t = Date.now();
      let box = st.box;
      if (g === 0) box = 1;
      else if (g === 1) box = Math.max(1, box);
      else box = Math.min(5, box + 1);
      const wait = g === 1 ? 10 * 60e3 : BOX_WAIT[box];
      S.flash[card.id] = { box, due: t + wait };
      save();
      render();
    },
    onKey(e) {
      if (!ticketEl.classList.contains("torn")) return;
      const g = { a: 0, s: 1, d: 2 }[e.key.toLowerCase()];
      if (g !== undefined) this.grade(g);
    }
  };
}

// ---------- 2. Điền chỗ trống ----------
function parseCloze(code) {
  // tách thành [text, {ans:[...]}, text, ...]
  const parts = [];
  let last = 0;
  code.replace(/\[\[(.+?)\]\]/g, (m, inner, at) => {
    parts.push(code.slice(last, at));
    parts.push({ ans: inner.split("|") });
    last = at + m.length;
  });
  parts.push(code.slice(last));
  return parts;
}
function expandLine(line) {
  // mọi cách viết đúng của một dòng có chỗ trống
  let outs = [""];
  for (const p of parseCloze(line)) {
    if (typeof p === "string") outs = outs.map((o) => o + p);
    else outs = outs.flatMap((o) => p.ans.map((a) => o + a));
  }
  return outs;
}

function clozeView(idx) {
  const item = CLOZE[idx - 1];
  const level = S.clozeLevel === 2 ? 2 : 1;
  let blanks = [];
  let html = "";
  if (level === 1) {
    for (const p of parseCloze(item.code)) {
      if (typeof p === "string") html += esc(p);
      else {
        const w = Math.max(3, ...p.ans.map((a) => a.length)) + 1;
        blanks.push({ accept: p.ans.map(strip), show: p.ans[0] });
        html += `<input class="blank" data-i="${blanks.length - 1}" style="width:${w}ch" aria-label="Chỗ trống ${blanks.length}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
      }
    }
  } else {
    html = item.code.split("\n").map((line) => {
      if (!line.includes("[[")) return esc(line);
      const indent = line.match(/^\s*/)[0];
      const variants = expandLine(line);
      blanks.push({ accept: variants.map(strip), show: variants[0].trim() });
      return `${indent}<input class="blank line" data-i="${blanks.length - 1}" aria-label="Dòng trống ${blanks.length}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    }).join("\n");
  }
  const [refId, refName] = relatedRef(item.topic);
  return {
    kind: "Điền chỗ trống", title: item.title,
    no: "Nº " + pad2(idx), noLabel: "trên " + CLOZE.length + " đoạn",
    meta: [["Chủ đề", esc(item.topic)], ["Mức", level === 1 ? "1 · từ khóa" : "2 · cả dòng"], ["Chỗ trống", String(blanks.length)]],
    tearLabel: "Xé cuống, chấm bài",
    body: `<div class="btn-row"><div class="seg" role="group" aria-label="Mức khó">
        <button type="button" data-level="1" aria-pressed="${level === 1}">Mức 1 · từ khóa</button>
        <button type="button" data-level="2" aria-pressed="${level === 2}">Mức 2 · cả dòng</button></div>
        <span class="hint">Enter sang chỗ kế tiếp. Ctrl+Enter để chấm.</span></div>
      <pre class="code">${html}</pre>`,
    foot: stepFoot("cloze", idx, CLOZE.length, `<a class="btn" href="#${refId}">${refName}</a>`),
    mount(el) {
      $$(".blank", el).forEach((inp, i, all) => {
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            if (all[i + 1]) all[i + 1].focus(); else tear();
          }
        });
      });
    },
    onTear(el) {
      const wrong = [];
      $$(".blank", el).forEach((inp) => {
        const b = blanks[+inp.dataset.i];
        const ok = b.accept.includes(strip(inp.value));
        inp.dataset.state = ok ? "ok" : "bad";
        if (!ok) wrong.push(`<li>Chỗ ${+inp.dataset.i + 1}: cần <code>${esc(b.show)}</code>${inp.value.trim() ? `, bạn điền <code>${esc(inp.value.trim())}</code>` : ", bạn bỏ trống"}</li>`);
      });
      const right = blanks.length - wrong.length;
      S.done["cloze:" + item.id] = wrong.length ? "part" : "ok";
      save();
      return `${resealBar(verdict(!wrong.length, `${right}/${blanks.length} chỗ đúng.${wrong.length ? "" : (level === 1 ? " Thử Mức 2: che cả dòng." : " Đoạn này đã thuộc.")}`))}
        ${wrong.length ? `<ol class="fixlist">${wrong.join("")}</ol>` : ""}`;
    },
    onReseal(el) { $$(".blank", el).forEach((inp) => { delete inp.dataset.state; }); }
  };

// ---------- 3. Xếp dòng code ----------
function parsonsView(idx) {
  const item = PARSONS[idx - 1];
  const lines = item.lines.map((l, i) => (Array.isArray(l) ? { i, t: l[0], g: l[1] } : { i, t: l, g: null }));
  let pool = shuffle(lines);
  while (lines.length > 2 && pool.every((l, k) => l.i === k)) pool = shuffle(lines);
  let picked = [];
  const tokenOf = (l) => (l.g ? "g:" + l.g : "t:" + l.t);

  const strips = (arr, where) => arr.map((l, k) =>
    `<button type="button" class="strip" data-where="${where}" data-i="${l.i}"><span class="n">${where === "pick" ? pad2(k + 1) : "··"}</span>${esc(l.t)}</button>`).join("");
  function paint(el) {
    $("#lane-pool", el).innerHTML = `<span class="lane-title">Dòng xáo trộn · bấm để chuyển sang</span>${strips(pool, "pool")}`;
    $("#lane-pick", el).innerHTML = `<span class="lane-title">Bài của bạn · bấm để trả lại</span>${strips(picked, "pick")}`;
  }
  return {
    kind: "Xếp dòng code", title: item.title,
    no: "Nº " + pad2(idx), noLabel: "trên " + PARSONS.length + " đoạn",
    meta: [["Chủ đề", esc(item.topic)], ["Số dòng", String(lines.length)]],
    tearLabel: "Xé cuống, kiểm tra thứ tự",
    body: `<p class="hint">Bấm từng dòng theo đúng thứ tự chương trình. Thụt lề đã giữ sẵn làm gợi ý.</p>
      <div class="parsons"><div class="lane" id="lane-pool"></div><div class="lane" id="lane-pick"></div></div>`,
    foot: stepFoot("parsons", idx, PARSONS.length, `<a class="btn" href="#${relatedRef(item.topic)[0]}">${relatedRef(item.topic)[1]}</a>`),
    mount(el) {
      paint(el);
      $(".parsons", el).addEventListener("click", (e) => {
        const b = e.target.closest(".strip");
        if (!b || ticketEl.classList.contains("torn")) return;
        const i = +b.dataset.i;
        if (b.dataset.where === "pool") {
          const l = pool.find((x) => x.i === i);
          pool = pool.filter((x) => x.i !== i);
          picked.push(l);
        } else {
          const l = picked.find((x) => x.i === i);
          picked = picked.filter((x) => x.i !== i);
          pool.push(l);
        }
        paint(el);
        const again = $(`.strip[data-where="${b.dataset.where}"]`, el) || $(".strip", el);
        if (again) again.focus();
      });
    },
    onTear(el) {
      let right = 0;
      $$('.strip[data-where="pick"]', el).forEach((s, k) => {
        const ok = lines[k] && tokenOf(picked[k]) === tokenOf(lines[k]);
        s.dataset.state = ok ? "ok" : "bad";
        if (ok) right++;
      });
      const allOk = right === lines.length;
      S.done["parsons:" + item.id] = allOk ? "ok" : "bad";
      save();
      return `${resealBar(verdict(allOk, `${right}/${lines.length} dòng đúng vị trí${pool.length ? `, còn ${pool.length} dòng chưa xếp` : ""}. Thứ tự đúng:`))}
        ${pre(lines.map((l) => l.t).join("\n"))}
        ${lines.some((l) => l.g) ? `<p class="hint">Các dòng cùng nhóm (ví dụ hai lệnh findViewById) đổi chỗ cho nhau vẫn tính đúng.</p>` : ""}`;
    },
    onReseal(el) { $$(".strip", el).forEach((s) => { delete s.dataset.state; }); }
  };
}

// ---------- 5. Viết lại từ trí nhớ ----------
function blurtSource(src) {
  const [kind, name] = src.split(/:(.+)/);
  const bag = kind === "file" ? EMB.files : kind === "part" ? EMB.parts : EMB.snip;
  return bag[name] || "";
}
const isComment = (l) => /^\s*(\/\/|<!--|\/\*|\*)/.test(l);
// dòng khai báo <?xml ...?> do Android Studio tự sinh, không bắt nhớ
function codeLines(text) { return text.split("\n").filter((l) => l.trim() && !isComment(l) && !/^\s*<\?xml/.test(l)); }
function lcsDiff(expect, got) {
  const a = expect.map(strip), b = got.map(strip);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { out.push({ s: "ok", t: expect[i] }); i++; j++; }
    else if (j < m && (i === n || dp[i][j + 1] > dp[i + 1][j])) { out.push({ s: "extra", t: got[j] }); j++; }
    else { out.push({ s: "miss", t: expect[i] }); i++; }
  }
  return out;
}

function blurtView(idx) {
  const item = BLURT[idx - 1];
  const expect = codeLines(blurtSource(item.src));
  return {
    kind: "Viết lại từ trí nhớ", title: item.title,
    no: "Nº " + pad2(idx), noLabel: "trên " + BLURT.length + " đoạn",
    meta: [["Chủ đề", esc(item.topic)], ["Số dòng code", String(expect.length)], ["Lần tốt nhất", S.done["blurt:" + item.id] != null ? S.done["blurt:" + item.id] + "%" : "chưa làm"]],
    tearLabel: "Xé cuống, so từng dòng",
    body: `<p class="prompt">${inline(item.prompt)}</p>
      <textarea class="writer" id="writer" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Viết code từ trí nhớ" placeholder="Gõ lại toàn bộ đoạn code. Tab chèn 4 dấu cách, Ctrl+Enter để so."></textarea>
      <p class="hint">Chỉ so nội dung từng dòng: khoảng trắng, thụt lề, dòng comment và dòng &lt;?xml ...?&gt; không tính.</p>`,
    foot: stepFoot("blurt", idx, BLURT.length, `<a class="btn" href="#${relatedRef(item.topic)[0]}">${relatedRef(item.topic)[1]}</a>`),
    mount(el) {
      const ta = $("#writer", el);
      ta.value = S.drafts[item.id] || "";
      ta.addEventListener("input", () => { S.drafts[item.id] = ta.value; save(); });
      ta.addEventListener("keydown", (e) => {
        if (e.key === "Tab" && !e.shiftKey) {
          e.preventDefault();
          const s = ta.selectionStart;
          ta.setRangeText("    ", s, ta.selectionEnd, "end");
          S.drafts[item.id] = ta.value; save();
        }
      });
    },
    onTear(el) {
      const got = codeLines($("#writer", el).value);
      const diff = lcsDiff(expect, got);
      const ok = diff.filter((d) => d.s === "ok").length;
      const pct = Math.round((ok / expect.length) * 100);
      const prev = S.done["blurt:" + item.id];
      S.done["blurt:" + item.id] = prev == null ? pct : Math.max(prev, pct);
      save();
      const label = { ok: "khớp", miss: "thiếu", extra: "thừa" };
      return `${resealBar(verdict(ok === expect.length, `${ok}/${expect.length} dòng khớp (${pct}%).`))}
        <ul class="diff">${diff.map((d) => `<li data-state="${d.s}"><span class="tag">${label[d.s]}</span><span>${esc(d.t)}</span></li>`).join("")}</ul>
        <p class="hint">“Thiếu” là dòng trong lời giải bạn chưa viết hoặc viết khác; “thừa” là dòng bạn viết mà lời giải không có.</p>`;
    }
  };
}

// ---------- 6. Tính tiền nhẩm ----------
const FARES = [["First Class", 1500], ["Business Class", 1300], ["Economy Class", 1000]];
function newFare() {
  const t = Math.floor(Math.random() * 3);
  const qty = 1 + Math.floor(Math.random() * 5);
  const disc = [0, 5, 10, 15, 20, 25, 30][Math.floor(Math.random() * 7)];
  const stars = [0, 3, 4, 5, 5][Math.floor(Math.random() * 5)];
  S.calc = { t, qty, disc, stars };
  save();
}
function parseMoney(s) {
  let v = String(s).trim().replace(/\s|k$/gi, "");
  if (/^\d{1,3}([.,]\d{3})+$/.test(v)) v = v.replace(/[.,]/g, "");
  else v = v.replace(",", ".");
  return v === "" ? NaN : Number(v);
}
function calcView() {
  if (!S.calc) newFare();
  const { t, qty, disc, stars } = S.calc;
  const [name, price] = FARES[t];
  const gross = price * qty;
  const base = gross * (1 - disc / 100);
  const total = stars === 5 ? base * 0.95 : base;
  return {
    kind: "Tính tiền nhẩm", title: "Khách này trả bao nhiêu?",
    no: "Nº " + pad2((S.calcCount || 0) + 1), noLabel: "vé đã tính: " + (S.calcCount || 0),
    meta: [["Giá", "First 1,500K · Business 1,300K · Economy 1,000K"]],
    tearLabel: "Xé cuống, xem cách tính",
    body: `<dl class="fare">
        <div><dt>Loại vé</dt><dd>${name}</dd></div>
        <div><dt>Số vé</dt><dd>${qty}</dd></div>
        <div><dt>Giảm giá</dt><dd>${disc}%</dd></div>
        <div><dt>Đánh giá</dt><dd>${stars ? `<span class="stars">${stars}/5</span> sao` : "chưa chấm"}</dd></div>
      </dl>
      <div class="field"><label for="fare-in">Tổng tiền, đơn vị K</label>
        <input id="fare-in" inputmode="decimal" autocomplete="off" placeholder="0"></div>
      <p class="hint">Tính trên giấy như lúc kiểm tra app. Enter để xem đáp án.</p>`,
    foot: `<span></span><button type="button" class="btn" data-act="new-fare">Vé mới <kbd class="kbd-hint">N</kbd></button>`,
    mount(el) {
      $("#fare-in", el).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); tear(); } });
    },
    onTear(el) {
      const got = parseMoney($("#fare-in", el).value);
      const ok = Math.abs(got - total) <= 1;
      S.calcCount = (S.calcCount || 0) + 1;
      save();
      const work = [
        `${price} × ${qty} = ${money(gross)}`,
        disc ? `${money(gross)} × (1 − ${disc}/100) = ${money(base)}` : `Không giảm giá: ${money(base)}`,
        stars === 5 ? `5 sao: ${money(base)} × 0.95 = ${money(total)}` : stars ? `${stars} sao: không giảm thêm` : "Chưa chấm sao: không giảm thêm"
      ];
      return `<div class="stub-bar">${verdict(ok, isNaN(got) ? "Bạn chưa nhập số. Đáp án: " + money(total) + "." : ok ? "Đúng: " + money(total) + "." : `Bạn ghi ${money(got)}, đúng là ${money(total)}.`)}<button type="button" class="linkish" data-act="new-fare">Vé mới</button></div>
        <ul class="work">${work.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>`;
    },
    onKey(e) { if (e.key.toLowerCase() === "n") { newFare(); render(); } }
  };
}

}

  requestAnimationFrame(markBoardOverflow);
  $("#rows-ref").innerHTML = REFS.map((r) =>
    `<li><a class="row" href="#${r.id}"${cur === r.id ? ' aria-current="page"' : ""}><span class="row-key"></span><span class="row-name">${esc(r.name)}</span><span class="row-state"></span></a></li>`).join("");
}
// còn dòng khuất dưới đáy bảng thì làm mờ mép dưới để báo cuộn được
function markBoardOverflow() {
  const nav = $(".board nav");
  if (!nav) return;
  const more = nav.scrollHeight - nav.clientHeight - nav.scrollTop > 4;
  nav.classList.toggle("more", more);
}
function tickClock() {
  const clock = $("#clock"), label = $("#clock-label");
  if (S.mockRun && S.mockRun.running) {
    const left = EXAM_MS - mockElapsed();
    clock.textContent = mmss(left);
    clock.dataset.mode = "exam";
    label.textContent = "Thi thử còn";
    const t = $("#timer");
    if (t) t.textContent = mmss(left);
    const st = $("#st-mock .num");
    if (st) st.textContent = mmss(left);
    if (left <= 0) { S.mockRun.acc = EXAM_MS; S.mockRun.running = false; save(); paintMockToggle(); paintBoard(); }
  } else {
    const d = new Date();
    clock.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    delete clock.dataset.mode;
    label.textContent = "Giờ hiện tại";
  }
}

// ---------- Điều hướng ----------
function render() {
  const [id, n] = (location.hash.slice(1) || "flash").split("/");
  const clamp = (list) => Math.min(list.length, Math.max(1, parseInt(n, 10) || 1));
  const ref = REFS.find((r) => r.id === id);
  let v;
  if (ref) v = refView(ref);
  else if (id === "cloze") v = clozeView(clamp(CLOZE));
  else if (id === "parsons") v = parsonsView(clamp(PARSONS));
  else if (id === "bug") v = bugView(clamp(BUGS));
  else if (id === "blurt") v = blurtView(clamp(BLURT));
  else if (id === "calc") v = calcView();
  else if (id === "mock") v = mockView();
  else if (id === "variant") v = variantView(clamp(VARIANTS));
  else v = flashView();
  v.route = id;
  v.idx = n ? parseInt(n, 10) || 1 : 1;
  mount(v);
  paintBoard();
}

function step(d) {
  if (!view) return;
  const lists = { cloze: CLOZE, parsons: PARSONS, bug: BUGS, blurt: BLURT, variant: VARIANTS };
  const list = lists[view.route];
  if (!list) return;
  const to = Math.min(list.length, Math.max(1, (view.idx || 1) + d));
  if (to !== view.idx) location.hash = view.route + "/" + to;
}

document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  const g = e.target.closest("[data-grade]");
  const lv = e.target.closest("[data-level]");
  if (g && view && view.grade) { view.grade(+g.dataset.grade); return; }
  if (lv) { S.clozeLevel = +lv.dataset.level; save(); render(); return; }
  if (!act) return;
  switch (act.dataset.act) {
    case "tear": tear(); break;
    case "reseal": reseal(); break;
    case "flash-extra": flashExtra = true; render(); break;
    case "new-fare": newFare(); render(); break;
    case "mock-toggle": {
      const r = S.mockRun || (S.mockRun = { acc: 0, since: 0, running: false });
      if (r.running) { r.acc += Date.now() - r.since; r.running = false; }
      else if (mockElapsed() < EXAM_MS) { r.since = Date.now(); r.running = true; }
      save(); paintMockToggle(); tickClock(); paintBoard();
      break;
    }
    case "mock-reset": S.mockRun = null; save(); render(); tickClock(); break;
    case "mock-save": {
      const d = new Date();
      S.mock.push({ date: `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`, used: mmss(mockElapsed()), score: rubricScore(ticketEl) });
      if (S.mockRun) { if (S.mockRun.running) { S.mockRun.acc += Date.now() - S.mockRun.since; } S.mockRun.running = false; }
      save(); render(); tickClock();
      break;
    }
  }
});

document.addEventListener("keydown", (e) => {
  const typing = e.target.closest("input, textarea, select");
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); tear(); return; }
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === " " && !e.target.closest("button, a, summary")) { e.preventDefault(); tear(); return; }
  if (/^[1-8]$/.test(e.key)) { location.hash = DRILLS[+e.key - 1].id; return; }
  if (e.key === "ArrowRight") { step(1); return; }
  if (e.key === "ArrowLeft") { step(-1); return; }
  if (view && view.onKey) view.onKey(e);
});

let resetArmed = null;
$("#reset").addEventListener("click", (e) => {
  const b = e.currentTarget;
  if (!resetArmed) {
    b.textContent = "Bấm lần nữa để xóa hết tiến độ";
    resetArmed = setTimeout(() => { b.textContent = "Xóa tiến độ"; resetArmed = null; }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  b.textContent = "Xóa tiến độ";
  S = freshState();
  try { localStorage.removeItem(STORE_KEY); } catch (err) { /* bỏ qua */ }
  render(); tickClock();
});

$("#route").innerHTML = `<strong>Lộ trình tối nay</strong><ol>${ROUTE.map(([id, t]) => `<li><a href="#${id}">${esc(t)}</a></li>`).join("")}</ol>`;
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
window.addEventListener("resize", markBoardOverflow);
$(".board nav").addEventListener("scroll", markBoardOverflow, { passive: true });
render();
tickClock();
setInterval(tickClock, 1000);
setInterval(() => { if (location.hash.slice(1).split("/")[0] === "flash" || !location.hash) paintBoard(); }, 30e3);
</script>
